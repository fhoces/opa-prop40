<!-- xaringan writes no viewport meta. Without one a phone lays the page out at a 980px virtual
     width and then "boosts" the font of some text blocks after layout (iOS text-size-adjust, Android
     font boosting), so text changes size after a moment and remark's scaled slide loses figures.
     Author report 2026-10-29. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
</style>
<script type="text/x-mathjax-config">
MathJax.Hub.Config({
  TeX: { extensions: ["color.js"], maxBuffer: 120 * 1024, maxMacros: 20000 }
});
</script>

<!-- A persistent "back to the landing page" link, present on every slide. remark.js
     renders one slide at a time inside .remark-slide-container elements it toggles
     visibility on, the same way it keeps its own bottom-right slide-number counter
     "present" throughout: that counter isn't per-slide markup either, it's a single
     element remark repositions/relabels on each transition. A real <a> can't be done
     that way (remark owns that element), so this attaches one plain, position:fixed
     link straight to <body>, outside every .remark-slide-container. It used to sit at
     a fixed viewport offset (top:8px/left:10px) and later at the slide's top-left, which put it in the grey letterboxing
     outside the slide's own box whenever the browser window wasn't exactly the deck's
     aspect ratio: this reads the currently VISIBLE slide's own .remark-slide-scaler
     rect and offsets from it instead, landing the link inside the slide regardless of
     window size, and re-measures on resize, on remark's own show-slide events, and via
     a MutationObserver on the slides area as a fallback in case a given browser/remark
     version doesn't fire the events the same way. Colors match this deck's .nav-btn
     buttons. -->
<style>
  .site-footer-link {
    position: fixed;
    z-index: 200;
    font-family: "STIX Two Text", "STIXGeneral", "Times New Roman", Times, serif;
    font-size: 13px;
    background: #ffffff;
    border: 1px solid #cfcfcf;
    padding: 1px 8px;
    text-decoration: none;
    color: #1d4e89;
  }
  .site-footer-link:hover { border-color: #666666; }
</style>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var a = document.createElement("a");
  a.href = "../../index.html";  // the comparison overview is the site root (this deck sits at talks/<name>/)
  a.className = "site-footer-link";
  a.textContent = "← Overview";
  document.body.appendChild(a);

  function positionLink() {
    // Read the VISIBLE slide's own scaler, not just the first one in the DOM: each
    // slide has its own .remark-slide-scaler, and while a fresh page load
    // gives them all identical inline styles, there is no guarantee every hidden one
    // stays in sync with every resize/fullscreen toggle. The visible one is always
    // authoritative for what is actually on screen.
    var visible = document.querySelector(".remark-slide-container.remark-visible .remark-slide-scaler");
    var scaler = visible || document.querySelector(".remark-slide-scaler");
    if (!scaler) return;
    // A slide whose content carries class "no-overview" (the credit-table build, which uses the
    // whole height) shows no link at all.
    var content = scaler.querySelector(".remark-slide-content");
    a.style.display = (content && content.classList.contains("no-overview")) ? "none" : "";
    var rect = scaler.getBoundingClientRect();
    // Bottom-left corner of the visible slide, clear of the slide number at the
    // bottom right and of the author credit, which the OPA slide raises above it.
    a.style.top = (rect.bottom - a.offsetHeight - 10) + "px";
    a.style.left = (rect.left + 10) + "px";
  }
  // The slide number reads "n / 10" throughout: the numerator keeps counting into the backup
  // slides, the denominator is fixed at 10 (author rule 2026-10-30; before that it read the
  // thank-you slide's own number, 11), instead of the deck's full length that remark would report.
  var talkEnd = "10";
  function pinDenominator() {
    var nums = document.querySelectorAll(".remark-slide-number");
    nums.forEach(function (n) {
      var parts = n.textContent.split("/");
      if (parts.length === 2) n.textContent = parts[0].trim() + " / " + talkEnd;
    });
  }
  function positionAndPin() { positionLink(); pinDenominator(); }
  positionAndPin();
  window.addEventListener("resize", positionAndPin);
  if (window.slideshow && typeof window.slideshow.on === "function") {
    window.slideshow.on("afterShowSlide", positionAndPin);
    window.slideshow.on("showSlide", positionAndPin);
  }
  // Belt and suspenders: watch the DOM directly for whichever slide remark marks
  // visible, independent of which JS event API actually fires.
  var slidesArea = document.querySelector(".remark-slides-area");
  if (slidesArea && window.MutationObserver) {
    new MutationObserver(positionAndPin).observe(slidesArea, {
      attributes: true, attributeFilter: ["class", "style"], subtree: true
    });
  }
});
</script>
