name: supporting-analysis CI

# EXPECTED TO FAIL as of phase 1 (2026-09-23): the August vintage of
# BSZ_MainTablesFigures.xlsx changed sheet layouts (new 2026 rows, a renamed
# Fig8 sheet, redefined Tab1/TabA1 columns) that the R pipeline's hardcoded
# row/column literals don't yet track. See supporting-analysis/VERIFY-AUGUST.md
# for the full classification. `continue-on-error: true` on the test step
# keeps this job green (informational) until those fixes land in a later
# phase; the tar_make step is expected to succeed on its own (the pipeline
# builds cleanly, it just doesn't verify correctly against Excel yet).
#
# Nothing is pushed as of phase 1; this workflow only runs once a GitHub
# remote exists.

on:
  push:
    paths:
      - "supporting-analysis/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "supporting-analysis/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch: {}

jobs:
  reproduce:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supporting-analysis
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install DESCRIPTION Imports
        run: |
          Rscript -e '
            deps <- read.dcf("DESCRIPTION", fields = "Imports")[1, 1]
            pkgs <- trimws(unlist(strsplit(deps, ",[[:space:]]*")))
            pkgs <- pkgs[nzchar(pkgs)]
            install.packages(pkgs, repos = "https://cloud.r-project.org")
          '

      - name: Fetch the August workbook and verify its SHA-256
        run: |
          mkdir -p original-materials
          curl -sL -o original-materials/BSZ_MainTablesFigures.xlsx \
            https://eml.berkeley.edu/~saez/BSZ_MainTablesFigures.xlsx
          echo "c236cc9413374402973d61bfdfc02b7e573b05ad9c2f0658ee6b66ad898cb6ce  original-materials/BSZ_MainTablesFigures.xlsx" \
            | sha256sum -c -

      - name: Run the pipeline (tar_make)
        run: Rscript -e 'targets::tar_make()'

      - name: Run the test suite
        continue-on-error: true
        run: Rscript tests/testthat.R
