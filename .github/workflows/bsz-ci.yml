name: bsz-analysis CI

# Rebuilds the bsz-analysis pipeline against the August 2026 BSZ
# workbook, data appendix updated 2026-10-08 (fetched and SHA-256 checked),
# and runs the full test suite, which must pass: every R derivation is
# compared cell by cell with the workbook's cached values. The May vintage
# (BSZ_VINTAGE=may) and the 2026-09-04 appendix (BSZ_VINTAGE=september) are
# verified locally; their workbooks are not fetched here. See
# bsz-analysis/VERIFY-AUGUST.md.

on:
  push:
    paths:
      - "bsz-analysis/**"
      - ".github/workflows/bsz-ci.yml"
  pull_request:
    paths:
      - "bsz-analysis/**"
      - ".github/workflows/bsz-ci.yml"
  workflow_dispatch: {}

jobs:
  reproduce:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bsz-analysis
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      # Installs DESCRIPTION Imports as RSPM binaries plus their system libraries
      # (libcurl, libuv, ...), and fails the step if any package does not install.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: bsz-analysis

      - name: Fetch the workbook (data appendix of 2026-10-08) and verify its SHA-256
        run: |
          mkdir -p original-materials
          curl -sL -o original-materials/BSZ_MainTablesFigures.xlsx \
            https://eml.berkeley.edu/~saez/BSZ_MainTablesFigures.xlsx
          echo "ea0c14107e1042182519d2f51a1dc157ee049cb33477a38d96f95cfe6f23f022  original-materials/BSZ_MainTablesFigures.xlsx" \
            | sha256sum -c -

      # The Quarto report targets need Quarto + LaTeX, which this runner lacks; CI
      # builds and tests every computation, table and figure, not the rendered report.
      - name: Run the pipeline (tar_make, without the report)
        run: Rscript -e 'targets::tar_make(names = !tidyselect::any_of(c("report_html", "report_pdf")))'

      # The Python twin of the pipeline, rebuilt here so the R vs Python parity test
      # compares freshly computed numbers, not the committed export/py.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run the Python twin
        run: |
          pip install -r requirements.txt
          python py/run_export.py

      - name: Run the test suite
        run: Rscript tests/testthat.R
